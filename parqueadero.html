<!DOCTYPE html>
<html>

<head>
<title>Mapa del Parqueadero</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<h1>Mapa del Parqueadero</h1>
<p>Seleccione un espacio disponible</p>
</header>

<div class="parking">

<div class="space libre" onclick="seleccionar(event,'A1')">A1</div>
<div class="space libre" onclick="seleccionar(event,'A2')">A2</div>
<div class="space ocupado">A3</div>
<div class="space libre" onclick="seleccionar(event,'A4')">A4</div>
<div class="space ocupado">A5</div>

<div class="space libre" onclick="seleccionar(event,'B1')">B1</div>
<div class="space ocupado">B2</div>
<div class="space libre" onclick="seleccionar(event,'B3')">B3</div>
<div class="space libre" onclick="seleccionar(event,'B4')">B4</div>
<div class="space ocupado">B5</div>

<div class="space libre" onclick="seleccionar(event,'C1')">C1</div>
<div class="space libre" onclick="seleccionar(event,'C2')">C2</div>
<div class="space ocupado">C3</div>
<div class="space libre" onclick="seleccionar(event,'C4')">C4</div>
<div class="space libre" onclick="seleccionar(event,'C5')">C5</div>

</div>

<br><br>

<div style="text-align:center">

<p id="espacioSeleccionado"></p>

<a href="salida.html" class="btnVehiculo">Ir a salida</a>

</div>

<script>

// marcar ocupados
window.onload = function(){

let activos = JSON.parse(localStorage.getItem("vehiculosActivos")) || [];

let espacios = document.querySelectorAll(".space");

activos.forEach((vehiculo, index) => {
if(espacios[index]){
espacios[index].classList.remove("libre");
espacios[index].classList.add("ocupado");
}
});

}

// seleccionar espacio
function seleccionar(event, espacio){

if(event.target.classList.contains("ocupado")){
return;
}

localStorage.setItem("espacio", espacio);

let espacios = document.querySelectorAll(".space");
espacios.forEach(e => e.classList.remove("seleccionado"));

event.target.classList.add("seleccionado");

document.getElementById("espacioSeleccionado").innerHTML =
"Espacio seleccionado: <b>" + espacio + "</b>";

}

</script>

</body>
</html>
